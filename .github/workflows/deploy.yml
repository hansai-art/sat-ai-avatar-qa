name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "demo 為清楚標示的架構預覽；production 需要正式內容與已確認課綱"
        required: true
        default: production
        type: choice
        options: [production, demo]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      BUILD_MODE: ${{ inputs.mode || 'production' }}
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set verified deployment paths
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "SITE_URL=$PAGES_ORIGIN" >> "$GITHUB_ENV"
          echo "BASE_PATH=$PAGES_BASE/" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - name: Build selected mode
        run: |
          if [ "$BUILD_MODE" = "demo" ]; then
            npm run build:demo
          else
            npm run build
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify public homepage
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 3 --retry-delay 5 "$PAGE_URL" --output homepage.html
          node -e "const fs=require('node:fs');if(!fs.readFileSync('homepage.html','utf8').includes('AI 分身'))process.exit(1)"
